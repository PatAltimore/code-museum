    context: This file is central to understanding how DOOM's engine starts and manages gameplay, including handling user
      input and rendering.
  - order: 2
    slug: r-main-c
    title: r_main.c
    path: linuxdoom-1.10/r_main.c
    description: Handles the rendering pipeline for DOOM's 3D graphics, a key innovation of the game.
